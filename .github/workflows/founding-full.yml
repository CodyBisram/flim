# Sends the "first hundred is full" push the moment the Founding 100 fills, then turns itself off.
# Every half hour it calls send-one-shot-push?campaign=founding-full&send=true. That campaign is
# empty while any seat is left, so nothing goes out until the hundredth person joins; then it
# sends once (the claim ledger never repeats a person), tells the owner through FLIM, and disables
# this workflow. Re-enable from the Actions tab only for a new campaign.
name: Founding 100 full

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: founding-full
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send if the first hundred is full
        env:
          ONE_SHOT_PUSH_SECRET: ${{ secrets.ONE_SHOT_PUSH_SECRET }}
          OWNER_NOTIFY_SECRET:  ${{ secrets.OWNER_NOTIFY_SECRET }}
          GH_TOKEN:             ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://wxvwamwrjlrvqmuaafjv.supabase.co/functions/v1"
          reply=$(curl -sS --fail-with-body -H "x-one-shot-secret: $ONE_SHOT_PUSH_SECRET" \
            "$base/send-one-shot-push?campaign=founding-full&send=true")
          echo "$reply"
          sent=$(echo "$reply" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sent", 0))')
          if [ "$sent" -gt 0 ]; then
            curl -sS -X POST "$base/notify-owner" -H "content-type: application/json" \
              -H "x-owner-notify-secret: $OWNER_NOTIFY_SECRET" \
              -d "{\"title\":\"The first hundred is full\",\"body\":\"The Founding 100 push went to $sent people.\"}"
            gh workflow disable founding-full.yml --repo "$GITHUB_REPOSITORY"
          fi
