# Sends the "first hundred is full" push the moment the Founding 100 fills, then turns itself off.
# Every half hour it calls send-one-shot-push?campaign=founding-full&send=true. That campaign is
# empty while any seat is left, so nothing goes out until the hundredth person joins; then it
# sends once (the claim ledger never repeats a person), tells the owner through FLIM, and disables
# this workflow. Re-enable from the Actions tab only for a new campaign.
#
# The function claims each person BEFORE pushing them, so a run whose pushes fail leaves those
# people claimed and unreachable by any rerun. scripts/one_shot_push_run.py reads the reply's
# claimed/sent/failed: whenever anyone was claimed and not reached, or the reply is too broken to
# tell, the owner gets a FLIM push and this job fails. The workflow still disables itself once
# anyone was claimed, because a rerun cannot reach a claimed person anyway.
name: Founding 100 full

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: founding-full
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Send if the first hundred is full
        id: send
        env:
          ONE_SHOT_PUSH_SECRET: ${{ secrets.ONE_SHOT_PUSH_SECRET }}
          OWNER_NOTIFY_SECRET:  ${{ secrets.OWNER_NOTIFY_SECRET }}
          FUNCTIONS_URL:        https://wxvwamwrjlrvqmuaafjv.supabase.co/functions/v1
        run: |
          python3 scripts/one_shot_push_run.py --campaign founding-full --label "Founding 100 push" \
            --success-title "The first hundred is full" \
            --success-body "The Founding 100 push went to {people}." \
            --after-failure "The founding-full workflow is now off."
      - name: Turn this workflow off once the push has gone
        if: always() && steps.send.outputs.claimed != '' && steps.send.outputs.claimed != '0' && steps.send.outputs.claimed != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable founding-full.yml --repo "$GITHUB_REPOSITORY"
