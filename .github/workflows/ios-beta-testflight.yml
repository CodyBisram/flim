name: iOS · FLIM Beta TestFlight

# FLIM Beta, the v2 test app: its own bundle id, Supabase project and TestFlight (see
# docs/TESTFLIGHT_SETUP.md, "FLIM Beta"). v2 is built on main under Flim/V2, so a push to main that
# touches v2 ships a beta build; anything else, including a change to the App Store app's screens
# that v2 also shows, ships one by hand (workflow_dispatch). The App Store app's pipeline
# (ios-testflight.yml) ignores v2's paths, so a v2-only push never ships an identical App Store
# build.
on:
  push:
    branches: [main]
    paths:
      - "Flim/V2/**"
      - "Flim/Resources/Fonts/**"
      - ".github/workflows/ios-beta-testflight.yml"
  workflow_dispatch:

# Its own lane. The App Store app's build number is that app's latest TestFlight build plus one,
# and FLIM Beta's is its own app's, so the two never collide and need not wait for each other.
concurrency:
  group: ios-beta-testflight
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FLIM Beta to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & upload FLIM Beta to TestFlight
        run: bundle exec fastlane beta
        env:
          FLIM_VARIANT:                  beta
          ASC_KEY_ID:                    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:                 ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:                    ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID:                 ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL:                 ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"

      - name: Archive dSYM for crash symbolication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsym-beta-${{ github.sha }}
          path: build/*.dSYM.zip
          retention-days: 90
          if-no-files-found: warn
