name: iOS · TestFlight

# PRs get a fast, secret-free simulator build (proof it compiles).
# Pushing to main (or running this workflow by hand) signs the app and ships
# it to TestFlight.
on:
  push:
    branches: [main]
    # Skip TestFlight builds for changes that can't affect the app binary —
    # docs, agent config, the Vercel site (deployed separately), and LUT tooling
    # (only the bundled .cube in Flim/Resources affects the app).
    paths-ignore:
      - ".claude/**"
      - "docs/**"
      - "web/**"
      - "scripts/**"
      # SQL migrations and edge functions deploy by hand, never through this
      # pipeline; a database-only commit must not ship an identical app build.
      - "supabase/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # PR validation — compile for the simulator. No signing, no secrets needed.
  # --------------------------------------------------------------------------
  build:
    name: Build & test (simulator)
    # Runs on every event, including pushes, because `deploy` needs it. This used
    # to be pull_request only and build only, which meant the suite never ran in
    # CI at all and a push to main went straight to TestFlight: a regression in
    # any covered pure function (reveal timing, auth rules, invite parsing, the
    # account-epoch guard) would ship with nothing to catch it.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # pin to e.g. '26.3' if a beta sneaks in

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Resolved at run time rather than hardcoded. `generic/platform=iOS Simulator`
      # cannot host a test run, and a pinned device name ("iPhone 17") silently
      # disappears whenever the runner image or Xcode moves, which turns the gate
      # below into a red build for a reason that has nothing to do with the code.
      # Picks the newest available iOS runtime, since the app's deployment target
      # is high and an older runtime cannot run it.
      - name: Choose a simulator
        id: sim
        run: |
          set -euo pipefail
          # jq rather than an inline python script: a multi-line python program
          # cannot live in a YAML block scalar, because indenting it to satisfy
          # YAML is an IndentationError and not indenting it ends the scalar.
          # Runtimes are sorted numerically, so iOS-9 never outranks iOS-26.
          UDID=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")
                           | [(.major | tonumber), (.minor | tonumber)])
            | reverse
            | map(.value[] | select(.isAvailable and (.name | contains("iPhone"))))
            | .[0].udid // empty
          ')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator on this runner." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project Flim.xcodeproj \
            -scheme Flim \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            test | xcbeautify --renderer github-actions || \
          xcodebuild \
            -project Flim.xcodeproj -scheme Flim -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO test

  # --------------------------------------------------------------------------
  # Swift 6 readiness — reports only, never blocks.
  #
  # The app builds in Swift 5 language mode. Under `-strict-concurrency=complete`
  # there are 23 real warnings, mostly `static let` on non-Sendable types
  # (CubeLUT.cache, ImageCache.shared, QuickCaptureIntent) plus four
  # sending-closure sites in CameraViewModel. Each one is an ERROR in Swift 6.
  #
  # The point is to keep that number from growing quietly while the migration is
  # still on the backlog, so the eventual switch is a known, bounded piece of
  # work instead of a surprise. It must never fail a build: nothing here is a
  # defect today, and a red X on a warning count trains people to ignore CI.
  # --------------------------------------------------------------------------
  concurrency-audit:
    name: Swift 6 readiness (advisory)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Count strict-concurrency warnings
        run: |
          set -o pipefail
          xcodebuild \
            -project Flim.xcodeproj \
            -scheme Flim \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build 2>&1 | tee /tmp/strict.log || true

          # Unique warnings only: xcodebuild repeats each one per compilation unit.
          grep -E "warning:.*(isolat|Sendable|concurren)" /tmp/strict.log \
            | sed 's|.*/Flim/|Flim/|' | sort -u > /tmp/strict-unique.txt || true
          COUNT=$(wc -l < /tmp/strict-unique.txt | tr -d ' ')

          {
            echo "### Swift 6 readiness"
            echo ""
            echo "**$COUNT** unique strict-concurrency warnings."
            echo ""
            echo "Advisory only. These become errors when the package moves to the"
            echo "Swift 6 language mode; the goal is that this number goes down, never up."
            echo ""
            echo '```'
            cat /tmp/strict-unique.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "strict-concurrency warnings: $COUNT"

  # --------------------------------------------------------------------------
  # Ship — signed Release archive uploaded to TestFlight.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to TestFlight
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # The gate. Without this, deploy ran independently of everything else, so a
    # push shipped to TestFlight whether or not the app even compiled elsewhere
    # in this file, let alone passed its tests. It costs one build's wait before
    # each release, which is the point.
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID:                    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:                 ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:                    ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID:                 ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL:                 ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # Keep fastlane quiet/non-interactive and CI-friendly.
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"

      # Keep the debug symbols. Without them a crash report is unreadable by anyone: MetricKit
      # records raw binary offsets, and only the dSYM from THIS exact build maps them back to
      # function names. gym writes it next to the .ipa and the runner is then destroyed, so
      # until now the only surviving copy was the one Apple keeps behind the developer account,
      # which is why crash triage required Xcode Organizer and therefore someone else's Apple ID.
      #
      # retention-days is set to the maximum GitHub allows this repo. It is PUBLIC, and public
      # repos are hard-capped at 90 days regardless of what is requested here (the API reports
      # maximum_allowed_days: 90); private repos allow up to 400. Asking for more is silently
      # clamped, so the number below is aspirational and 90 is what you actually get. That matters
      # because MetricKit delivers diagnostics on a LATER launch, so crash reports routinely arrive
      # long after the build that produced them: past 90 days a crash becomes unreadable again.
      # Making the repo private is what would actually buy the longer window.
      - name: Archive dSYM for crash symbolication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsym-${{ github.sha }}
          path: build/*.dSYM.zip
          retention-days: 400
          if-no-files-found: warn
