<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0908" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e7e3da" media="(prefers-color-scheme: light)">
  <title>Join a roll on FLIM</title>
  <meta name="description" content="Join your friends' film roll on FLIM. Shoot together, develop together.">
  <meta property="og:site_name" content="FLIM">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://flim-app.com/join">
  <meta property="og:title" content="You're invited to a roll on FLIM">
  <meta property="og:description" content="Join your friends' film roll. Shoot together, develop together.">
  <meta property="og:image" content="https://flim-app.com/og-join.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="You're invited to a roll on FLIM">
  <meta name="twitter:description" content="Join your friends' film roll. Shoot together, develop together.">
  <meta name="twitter:image" content="https://flim-app.com/og-join.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Applied before first paint so the chosen condition does not flash.
    (function () {
      try {
        var saved = localStorage.getItem("flim-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="/">FL<span>I</span>M</a>
      <nav>
        <button class="themer" id="themer" type="button"><span>Lighttable</span></button>
      </nav>
    </div>
  </header>

  <main class="wrap invite">
    <div class="invite-head">
      <h1>You&rsquo;re invited to a roll</h1>
      <p class="invite-lede">Everyone shoots into this roll, and it develops for all of you at once.</p>
    </div>

    <div class="code" id="code">&middot;&middot;&middot;&middot;&middot;</div>

    <!-- A roll invite only means anything to someone who already has the app, so
         Open FLIM leads here. The personal invite page at /i is the other way
         round, because that link almost always reaches someone without it. -->
    <div class="invite-actions">
      <a class="btn btn-primary" id="open" href="#">Open FLIM</a>
      <a class="btn btn-secondary" href="https://apps.apple.com/us/app/flim-disposable-camera/id6786079629">Get FLIM</a>
    </div>

    <div class="invite-notes">
      <p>Already have FLIM? Tap <strong>Open FLIM</strong>, or enter the code under <strong>Rolls</strong>, then <strong>Join</strong>.</p>
      <p>New here? FLIM is invite-only, so ask your friend for an invite as well as this code.</p>
    </div>
  </main>

  <script src="/theme.js"></script>
  <script>
    // /join/CODE shows the code and deep links the Open button into the app.
    (function () {
      var code = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
      var valid = /^[A-Z0-9]{4,10}$/i.test(code) && code.toLowerCase() !== "join";
      var open = document.getElementById("open");

      if (valid) {
        document.getElementById("code").textContent = code.toUpperCase();
        open.href = "com.lapse.app://join/" + code.toUpperCase();
      } else {
        // No code means nothing to open, so the control goes rather than sitting
        // there doing nothing when pressed.
        open.style.display = "none";
      }
    })();
  </script>
</body>
</html>
