<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <!-- Not a public page. Nothing here is secret, since every call is gated server
       side by is_owner(), but there is no reason for it to sit in a search index. -->
  <meta name="robots" content="noindex, nofollow">
  <title>FLIM admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    /* Deliberately NOT the marketing stylesheet. The public site is a warm, dark,
       editorial thing built around a film metaphor; this is a tool for reading
       queues and clearing them. Density and legibility win here, so it follows
       the slate-and-cards idiom of the reports dashboard instead, with FLIM's
       amber in place of that project's indigo. */

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-soft: #f1f5f9;

      --text: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;

      --accent: #b45309;
      --accent-soft: #fffbeb;
      --accent-border: #fde68a;

      --side: #f1f5f9;
      --side-text: #475569;
      --side-active: #ffffff;
      --side-hover: #e5e9ef;

      --ok-bg: #ecfdf5; --ok-fg: #047857; --ok-br: #a7f3d0;
      --bad-bg: #fef2f2; --bad-fg: #b91c1c; --bad-br: #fecaca;

      --sans: "Geist", system-ui, -apple-system, sans-serif;
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--border-soft); }
    ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    /* ---- Sidebar ---------------------------------------------------------- */

    .side {
      width: 224px;
      flex-shrink: 0;
      background: var(--side);
      color: var(--text);
      padding: 12px 8px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100dvh;
    }

    .side__brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--side-text);
      padding: 4px 10px 14px;
      white-space: nowrap;
    }
    .side__brand span { color: #f59e0b; }

    .side__nav { list-style: none; display: flex; flex-direction: column; gap: 2px; flex: 1; }

    .navitem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--side-text);
      font-family: var(--sans);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .navitem:hover { background: var(--side-hover); color: var(--text); }
    .navitem[aria-current="true"] {
      background: var(--side-active);
      color: var(--text);
      border-left-color: #f59e0b;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    /* The count is the reason to click, so it is not decoration: zero goes quiet,
       anything above zero stays legible at a glance. */
    .navitem__count {
      font-family: var(--mono);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--muted);
    }
    .navitem__count[data-any="true"] { background: #f59e0b; color: #1c1917; font-weight: 600; }

    .side__foot { padding: 8px 2px 0; border-top: 1px solid var(--border); }
    .side__who { font-family: var(--mono); font-size: 11px; color: var(--faint); padding: 6px 8px; overflow-wrap: anywhere; }

    /* ---- Content ---------------------------------------------------------- */

    .content { flex: 1; padding: 20px 24px 60px; min-width: 0; }

    .page__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .page__head h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .page__sub { font-size: 13px; color: var(--muted); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      /* Top aligned, not centred: a card with a note is three times the height of
         one without, and centring leaves its buttons stranded beside the note
         instead of beside the address they act on. */
      align-items: flex-start;
      gap: 10px 16px;
    }
    .card__main { flex: 1 1 280px; min-width: 0; }
    .card__title {
      font-family: var(--mono);
      font-size: 13.5px;
      font-weight: 500;
      overflow-wrap: anywhere;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card__meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    /* Free text a stranger typed. Inset so it never reads as our own copy. */
    .card__note {
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--border-soft);
      border-left: 2px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      color: #334155;
      overflow-wrap: anywhere;
    }
    .card__actions { display: flex; gap: 6px; flex: 0 0 auto; }

    .pill {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .pill--bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-br); }

    .btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: var(--border-soft); border-color: var(--faint); }
    .btn--go { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn--go:hover { background: #92400e; border-color: #92400e; }
    .btn[disabled] { opacity: 0.5; pointer-events: none; }

    .empty {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      color: var(--faint);
      font-size: 13.5px;
    }

    .status { min-height: 1.3em; margin-top: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .status[data-tone="bad"] { color: var(--bad-fg); }

    /* ---- Sign in ---------------------------------------------------------- */

    .gate { margin: auto; width: 100%; max-width: 360px; padding: 24px; }
    .gate__card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; }
    .gate__brand { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; margin-bottom: 4px; }
    .gate__brand span { color: var(--accent); }
    .gate__sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .field {
      width: 100%;
      font-family: var(--sans);
      font-size: 16px; /* 16px or iOS zooms on focus */
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      margin-bottom: 8px;
    }
    .field::placeholder { color: var(--faint); }
    .gate .btn { width: 100%; justify-content: center; padding: 10px; }

    /* ---- Analytics ------------------------------------------------------
       Numbers, not queues. The moderation panels are lists of things to act on
       one at a time; these are a shape you read at a glance, so they get their
       own vocabulary rather than being forced into .card. */

    .side__label {
      padding: 14px 16px 6px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #78716c;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .stat__n {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stat__l { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .stat__sub { font-size: 11px; color: var(--faint); margin-top: 3px; }
    /* Week-over-week delta, coloured by direction. Every headline overview metric is
       more-is-better (new users, shooters, shots, reveals, posts, redemptions), so up is
       unambiguously green and down red; flat stays quiet. */
    .stat__delta--up   { color: var(--ok-fg); font-weight: 500; }
    .stat__delta--down { color: var(--bad-fg); font-weight: 500; }
    .stat__delta--flat { color: var(--faint); }
    .stat--warn .stat__n { color: var(--accent); }

    .sect { margin: 22px 0 10px; font-size: 13px; font-weight: 600; }
    .sect__note { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }

    /* A bar per row, sized by share of the largest value. Deliberately not a
       chart library: this page is a single self-contained file served as a
       static asset, and one <div> with a width is the whole requirement. */
    .bars { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
    .bar__l { flex: 0 0 168px; font-size: 12.5px; overflow-wrap: anywhere; }
    .bar__track { flex: 1; height: 8px; background: var(--border-soft); border-radius: 4px; overflow: hidden; min-width: 40px; }
    .bar__fill { height: 100%; background: var(--accent); border-radius: 4px; }
    .bar__n {
      /* Measured, not guessed: "50 shots \u00b7 10 people" needs 144px at this size, and at 78px
         and again at 132px it wrapped, turning a ten-row chart into twenty ragged ones. nowrap
         so a longer string overflows visibly rather than silently going two-line again. */
      flex: 0 0 176px;
      white-space: nowrap;
      text-align: right;
      font-family: var(--mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    /* A step whose logging began after the cohort did. Its number is a floor,
       not a measurement, and dimming it says so without hiding it. */
    .bar--dim .bar__l, .bar--dim .bar__n { color: var(--faint); }
    .bar--dim .bar__fill { background: var(--faint); }

    .tbl { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .tbl th, .tbl td { padding: 8px 12px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--border); }
    .tbl th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 500; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl td.num, .tbl th.num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl td.num { font-family: var(--mono); }
    /* A trailing spacer column absorbs the slack, so the real columns stay next to each other.
       Without it a table spreads its columns across the full width and the eye travels half a
       screen from a name to its number. Doing this by widening the LAST real column instead was
       tried and is wrong the moment that column is numeric: it pushed Day 14 to the far edge and
       squeezed the week into three lines. */
    .tbl th.spacer, .tbl td.spacer { width: 100%; padding: 0; }
    .tbl th, .tbl td { white-space: nowrap; }
    .tbl td.wrap { white-space: normal; }
    .tbl td.who { font-family: var(--mono); }
    /* Wide tables scroll inside their own box; the page body never does. */
    .tblwrap { overflow-x: auto; margin-bottom: 4px; }

    .hide { display: none !important; }

    /* ---- Spotlight --------------------------------------------------------
       The one queue that is judged by eye, so the frame leads each card, at the
       app's own 3:4. */
    .spot__img {
      width: 120px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 6px;
      background: var(--border-soft);
      border: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .spot__missing {
      width: 120px;
      aspect-ratio: 3 / 4;
      border-radius: 6px;
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: var(--faint);
      flex: 0 0 auto;
    }
    .card--chosen { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b inset; }
    .card--removed { opacity: 0.55; }
    .spot__week {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 10px;
    }
    .spot__week .sect { margin: 0; }
    .spot__week-acts { display: flex; gap: 8px; flex: 0 0 auto; }
    .spot__views { display: flex; gap: 8px; margin: 0 0 6px; }
    .spot__views .btn[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }

    @media (max-width: 720px) {
      body { flex-direction: column; }
      .side {
        width: 100%; height: auto; position: static;
        flex-direction: row; align-items: center; gap: 4px;
        padding: 8px; overflow-x: auto;
      }
      .side__brand { padding: 0 8px 0 4px; }
      .side__nav { flex-direction: row; flex: 1; }
      .navitem { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; }
      .navitem[aria-current="true"] { border-left-color: transparent; border-bottom-color: #f59e0b; }
      .side__foot { display: none; }
      .content { padding: 16px 14px 48px; }
      .card__actions { width: 100%; }
      .btn { flex: 1; }
    }
  </style>
</head>
<body>

  <!-- Signed out -->
  <div class="gate" id="gate">
    <div class="gate__card">
      <div class="gate__brand">FL<span>I</span>M</div>
      <p class="gate__sub">Admin. Owner account only.</p>
      <form id="signin">
        <input class="field" id="email" type="email" autocomplete="email"
               inputmode="email" placeholder="you@example.com" required>
        <input class="field hide" id="code" type="text" inputmode="numeric"
               autocomplete="one-time-code" placeholder="6 digit code">
        <button class="btn btn--go" id="gate-go" type="submit">Send a code</button>
        <p class="status" id="gate-status"></p>
      </form>
    </div>
  </div>

  <!-- Signed in -->
  <aside class="side hide" id="side">
    <div class="side__brand">FL<span>I</span>M</div>
    <ul class="side__nav" id="nav">
      <li><button class="navitem" data-panel="invites">Invites <span class="navitem__count" id="c-invites">0</span></button></li>
      <li><button class="navitem" data-panel="photos">Reported photos <span class="navitem__count" id="c-photos">0</span></button></li>
      <li><button class="navitem" data-panel="users">Reported people <span class="navitem__count" id="c-users">0</span></button></li>
      <li><button class="navitem" data-panel="feedback">Feedback <span class="navitem__count" id="c-feedback">0</span></button></li>
      <li><button class="navitem" data-panel="spotlight">Spotlight <span class="navitem__count" id="c-spotlight">0</span></button></li>
      <li class="side__label">Analytics</li>
      <li><button class="navitem" data-panel="overview" aria-current="true">Overview</button></li>
      <li><button class="navitem" data-panel="traffic">Traffic</button></li>
      <li><button class="navitem" data-panel="pulse">Pulse</button></li>
      <li><button class="navitem" data-panel="funnel">Funnel</button></li>
      <li><button class="navitem" data-panel="reach">Reach</button></li>
      <li><button class="navitem" data-panel="stuck">Who is stuck</button></li>
      <li><button class="navitem" data-panel="retention">Retention</button></li>
      <li><button class="navitem" data-panel="versions">Versions</button></li>
    </ul>
    <div class="side__foot">
      <div class="side__who" id="who"></div>
      <button class="navitem" id="signout" type="button">Sign out</button>
    </div>
  </aside>

  <main class="content hide" id="content">
    <div class="page__head">
      <h1 id="page-title">Invites</h1>
      <span class="page__sub" id="page-sub"></span>
    </div>
    <div id="list"></div>
    <p class="status" id="panel-status"></p>
  </main>

  <script>
  (function () {
    "use strict";

    var URL_BASE = "https://wxvwamwrjlrvqmuaafjv.supabase.co";
    var ANON_KEY = "sb_publishable_ze8KEytcVzvKOijlUQ8Kfw_nb3kJ-V4";

    /* sessionStorage, not localStorage: an admin session should not outlive the
       tab. There is no service role key on this page, and every call below is
       gated server side by is_owner(), so this token only ever buys what this
       account could already do. */
    var TOKEN_KEY = "flim-admin-token";
    var token = null;
    try { token = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}

    var data = { invites: [], photos: [], users: [], feedback: [], spotlight: [], spotlightPublished: [] };
    /* The Spotlight panel has two views: "waiting" (closed weeks not yet
       published, the queue) and "published" (the last eight weeks that went
       out, so any frame can still be removed). */
    var spotView = "waiting";
    /* The week still open, shown read-only above the waiting weeks so frames put
       up today are visible before the week closes. Null until loaded; { error }
       when either call failed; else { key, closesAt, rows }. Kept out of `data`
       so the sidebar count stays the waiting queue only. */
    var spotOpen = null;
    /* Signed URLs for Spotlight frames, by storage path, so switching panels does
       not sign the same frame again. The owner can sign a frame that is only put
       up (not yet public) because the storage read policy has an owner clause for
       Spotlight entries; a frame hidden or in a block with the owner cannot be
       signed, and the card says so instead of showing a broken image. */
    var signed = {};
    var signedAt = 0;
    /* Analytics live beside the queues rather than in them: a queue is a list of
       rows to act on, and every one of these is a different shape. Null until
       loaded, so a panel can tell "still fetching" from "the answer is nothing". */
    var stats = { overview: null, funnel: null, reach: null, stuck: null, pulse: null,
                  retention: null, storage: null, campaigns: null, versions: null,
                  traffic: null };
    var ANALYTICS = ["overview", "traffic", "pulse", "funnel", "reach", "stuck", "retention", "versions"];
    var panel = "overview";
    var TITLES = {
      invites: "Invites",
      photos: "Reported photos",
      users: "Reported people",
      feedback: "Feedback",
      spotlight: "Spotlight",
      spotlightPublished: "Spotlight (published)",
      overview: "Overview",
      traffic: "Traffic",
      pulse: "Pulse",
      funnel: "Funnel",
      reach: "Reach",
      stuck: "Who is stuck",
      retention: "Retention",
      versions: "Versions",
    };

    function $(id) { return document.getElementById(id); }
    function show(el) { el.classList.remove("hide"); }
    function hide(el) { el.classList.add("hide"); }
    function say(el, msg, tone) {
      el.textContent = msg;
      if (tone) el.setAttribute("data-tone", tone); else el.removeAttribute("data-tone");
    }

    /* Everything rendered below came from a stranger: invite notes, report
       reasons, usernames. It is all set through textContent, never innerHTML. */
    function el(tag, cls, value) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (value !== undefined && value !== null) n.textContent = String(value);
      return n;
    }

    function ago(iso) {
      var m = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
      if (m < 60) return m + "m ago";
      var h = Math.floor(m / 60);
      if (h < 24) return h + "h ago";
      return Math.floor(h / 24) + "d ago";
    }
    function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

    async function rpc(name, body) {
      var res = await fetch(URL_BASE + "/rest/v1/rpc/" + name, {
        method: "POST",
        headers: {
          "apikey": ANON_KEY,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body || {}),
      });
      if (res.status === 401) { signOut(); throw new Error("Session expired. Sign in again."); }
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    /* Traffic is the one panel whose numbers are not in our database. Vercel Web
       Analytics holds them, and reading them needs an account token that cannot
       live in this file, so /api/traffic proxies the call. It is handed the same
       session token as every RPC above and re-checks is_owner() server side
       before it spends the Vercel one, so this is not a second way in. */
    async function traffic() {
      var res = await fetch("/api/traffic", {
        headers: { "Authorization": "Bearer " + token },
      });
      if (res.status === 401) { signOut(); throw new Error("Session expired. Sign in again."); }
      if (!res.ok) throw new Error((await res.text()).slice(0, 200));
      return res.json();
    }

    // ---- Sign in -----------------------------------------------------------

    var stage = "email";

    $("signin").addEventListener("submit", async function (e) {
      e.preventDefault();
      var email = $("email").value.trim();
      if (!email) return;

      /* Sending the code goes out over the network and through an email
         provider, so it can sit for a couple of seconds. A button that only
         greys out reads as a hang, and the natural response is to press it
         again, which sends a second code and invalidates the first. */
      var idle = $("gate-go").textContent;
      $("gate-go").disabled = true;
      $("gate-go").textContent = stage === "email" ? "Sending" : "Checking";
      say($("gate-status"), "");

      try {
        if (stage === "email") {
          var otp = await fetch(URL_BASE + "/auth/v1/otp", {
            method: "POST",
            headers: { "apikey": ANON_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, create_user: false }),
          });
          if (!otp.ok) throw new Error("Could not send a code to that address.");
          stage = "code";
          show($("code"));
          idle = "Sign in";
          say($("gate-status"), "Code sent. Check your email.");
          $("code").focus();
        } else {
          var v = await fetch(URL_BASE + "/auth/v1/verify", {
            method: "POST",
            headers: { "apikey": ANON_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, token: $("code").value.trim(), type: "email" }),
          });
          if (!v.ok) throw new Error("That code did not work.");
          var session = await v.json();
          token = session.access_token;
          try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e2) {}
          $("who").textContent = email;
          await enter();
        }
      } catch (err) {
        say($("gate-status"), String(err.message || err).slice(0, 160), "bad");
      } finally {
        $("gate-go").disabled = false;
        $("gate-go").textContent = idle;
      }
    });

    function signOut() {
      token = null;
      try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
      hide($("side")); hide($("content")); show($("gate"));
      stage = "email";
      hide($("code"));
      $("gate-go").textContent = "Send a code";
    }
    $("signout").addEventListener("click", signOut);

    // ---- Panels ------------------------------------------------------------

    Array.prototype.forEach.call(document.querySelectorAll(".navitem[data-panel]"), function (b) {
      b.addEventListener("click", function () {
        panel = b.getAttribute("data-panel");
        Array.prototype.forEach.call(document.querySelectorAll(".navitem[data-panel]"), function (o) {
          o.setAttribute("aria-current", String(o === b));
        });
        render();
      });
    });

    function card(titleNode, metaText, noteText, buttons) {
      var c = el("div", "card");
      var main = el("div", "card__main");
      main.appendChild(titleNode);
      main.appendChild(el("div", "card__meta", metaText));
      if (noteText) main.appendChild(el("div", "card__note", noteText));
      c.appendChild(main);

      var acts = el("div", "card__actions");
      buttons.forEach(function (b) { acts.appendChild(b); });
      c.appendChild(acts);
      return c;
    }

    function render() {
      $("page-title").textContent = TITLES[panel];
      var host = $("list");
      host.textContent = "";
      if (ANALYTICS.indexOf(panel) !== -1) { renderStats(host); return; }
      if (panel === "spotlight") { renderSpotlight(host); return; }
      var rows = data[panel];
      $("page-sub").textContent = rows.length
        ? plural(rows.length, panel === "invites" ? "person waiting"
                            : panel === "feedback" ? "unread" : "open")
        : "";

      if (!rows.length) {
        host.appendChild(el("div", "empty",
          panel === "invites" ? "Nobody is waiting."
          : panel === "feedback" ? "No feedback yet." : "Nothing to review."));
        return;
      }

      rows.forEach(function (r) {
        var c;
        if (panel === "invites") {
          var t = el("div", "card__title", r.email);
          var approve = el("button", "btn btn--go", "Approve");
          var decline = el("button", "btn", "Decline");
          approve.addEventListener("click", function () { act(c, "approve_invite_request", { p_email: r.email }); });
          decline.addEventListener("click", function () { act(c, "decline_invite_request", { p_email: r.email }); });
          c = card(t, ago(r.created_at), r.note, [approve, decline]);

        } else if (panel === "photos") {
          var pt = el("div", "card__title", "@" + (r.reported_username || "unknown"));
          if (r.hidden) pt.appendChild(el("span", "pill", "hidden"));
          if (r.report_count > 1) pt.appendChild(el("span", "pill pill--bad", r.report_count + " reports"));
          var toggle = el("button", r.hidden ? "btn" : "btn btn--go", r.hidden ? "Unhide" : "Hide");
          var dismissP = el("button", "btn", "Dismiss");
          toggle.addEventListener("click", function () {
            act(c, "set_photo_hidden", { p_photo_id: r.photo_id, p_hidden: !r.hidden });
          });
          dismissP.addEventListener("click", function () {
            act(c, "dismiss_photo_report", { p_photo_id: r.photo_id });
          });
          c = card(pt, ago(r.created_at), r.reason, [toggle, dismissP]);

        } else if (panel === "users") {
          var ut = el("div", "card__title", "@" + (r.reported_username || "unknown"));
          if (r.report_count > 1) ut.appendChild(el("span", "pill pill--bad", r.report_count + " reports"));
          var dismissU = el("button", "btn", "Dismiss");
          dismissU.addEventListener("click", function () {
            act(c, "dismiss_user_report", { p_reported_id: r.reported_id });
          });
          c = card(ut, ago(r.created_at), r.reason, [dismissU]);

        } else {
          /* The build and device are the point of this queue: they are what a
             mailto: report never carried, and what a bug report otherwise costs
             a round trip to ask for. */
          var ft = el("div", "card__title", "@" + (r.username || "unknown"));
          var stamp = [r.app_version && r.app_build ? r.app_version + " (" + r.app_build + ")" : r.app_version,
                       r.device_model, r.os_version].filter(Boolean).join(" · ");
          if (stamp) ft.appendChild(el("span", "pill", stamp));
          var dismissF = el("button", "btn", "Dismiss");
          dismissF.addEventListener("click", function () {
            act(c, "dismiss_feedback", { p_id: r.id });
          });
          c = card(ft, ago(r.created_at), r.message, [dismissF]);
        }
        host.appendChild(c);
      });
    }

    // ---- Spotlight ----------------------------------------------------------

    var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                  "August", "September", "October", "November", "December"];
    /* From the key string itself ("2026-09-21"), never through Date: parsing a
       bare date as midnight UTC reads as the day before anywhere west of it. */
    function weekLabel(key) {
      var p = String(key).split("-");
      return "the week of " + MONTHS[Number(p[1]) - 1] + " " + Number(p[2]);
    }
    function dayLabel(iso) {
      return new Date(iso).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    }
    function framePath(r) { return r.feed_path || r.thumb_path || r.storage_path; }

    /* The server's refusals, in words. Anything else falls through as the raw
       message, which is what every other queue does. */
    var SPOT_REFUSALS = {
      limit: "Six are already chosen for this week. Unchoose one first.",
      already_published: "Already published. Nothing changed.",
      none_chosen: "Choose at least one frame before publishing.",
      week_open: "That week has not closed yet.",
      hidden: "That frame is hidden, so it cannot be chosen.",
      covered: "That frame is in a covered window, so it cannot be chosen.",
      tagged: "That frame has people tagged, so it cannot be chosen.",
      not_photographer: "That frame was shot by someone else.",
      blocked: "You and this person have a block between you, so it cannot be chosen.",
      week_skipped: "That week was skipped. Nothing from it can be published.",
      week_stale: "That week closed more than two weeks ago, so it can no longer be published.",
      not_found: "That frame is not in Spotlight anymore."
    };
    function refusal(err) {
      var raw = String(err && err.message || err);
      var name = raw;
      try { name = JSON.parse(raw).message || raw; } catch (e) {}
      return { name: name, text: SPOT_REFUSALS[name] || ("That did not go through: " + raw.slice(0, 140)) };
    }

    /* The message is set AFTER the refetch: load() clears the status line. */
    async function spotAct(cardEl, name, body) {
      Array.prototype.forEach.call(cardEl.querySelectorAll("button"), function (b) { b.disabled = true; });
      var msg = "";
      try {
        await rpc(name, body);
      } catch (err) {
        msg = refusal(err).text;
      }
      await load();
      if (msg) say($("panel-status"), msg, "bad");
    }

    async function publishWeek(btn, week, chosenCount) {
      if (!confirm("Publish " + plural(chosenCount, "frame") + " for " + weekLabel(week)
                   + " to everyone on FLIM? Each person chosen gets a push. This cannot be undone,"
                   + " though any frame can be removed afterwards.")) return;
      btn.disabled = true;
      var msg, tone;
      try {
        var out = await rpc("publish_spotlight_week", { p_week_key: week });
        var n = out && out[0] ? out[0].frames : chosenCount;
        msg = "Published " + plural(n, "frame") + " for " + weekLabel(week) + ".";
      } catch (err) {
        var r = refusal(err);
        /* A second press, or a second tab, lands here. It changed nothing, so it
           is said plainly rather than in the error colour. */
        msg = r.text;
        tone = r.name === "already_published" ? undefined : "bad";
      }
      await load();
      say($("panel-status"), msg, tone);
    }

    /* Skipping is final: the week's choices stay on the server but nothing from it can be
       published, and it leaves the waiting list. */
    async function skipWeek(btn, week) {
      if (!confirm("Skip " + weekLabel(week) + "? Nothing from it is published, and it leaves this list."
                   + " This cannot be undone.")) return;
      btn.disabled = true;
      var msg, tone;
      try {
        await rpc("close_spotlight_week", { p_week_key: week });
        msg = "Skipped " + weekLabel(week) + ".";
      } catch (err) {
        var r = refusal(err);
        msg = r.text;
        tone = r.name === "already_published" ? undefined : "bad";
      }
      await load();
      say($("panel-status"), msg, tone);
    }

    /* One batch per render for every frame not yet signed. Storage answers per
       path; a path it refuses stays unsigned and its card says why. */
    async function signFrames(paths) {
      var need = paths.filter(function (p) { return p && !(p in signed); });
      if (!need.length) return;
      var res = await fetch(URL_BASE + "/storage/v1/object/sign/photos", {
        method: "POST",
        headers: {
          "apikey": ANON_KEY,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ expiresIn: 3600, paths: need }),
      });
      /* Every path asked about gets an answer, even a failed call, so a render
         after this can never ask again and loop. */
      need.forEach(function (p) { signed[p] = null; });
      if (!res.ok) return;
      var out = await res.json();
      (out || []).forEach(function (o) {
        if (o && o.path) signed[o.path] = o.signedURL ? URL_BASE + "/storage/v1" + o.signedURL : null;
      });
    }

    function frameNode(r) {
      var path = framePath(r);
      var url = signed[path];
      if (url) {
        var img = document.createElement("img");
        img.className = "spot__img";
        img.loading = "lazy";
        img.alt = "Frame by @" + (r.username || "unknown");
        img.src = url;
        return img;
      }
      return el("div", "spot__missing",
        url === null ? (r.removed_at ? "Removed, no longer shown"
                        : r.blocked_with_owner ? "Cannot load: block with you"
                        : r.hidden ? "Cannot load: hidden"
                        : r.covered ? "Cannot load: covered" : "Cannot load")
                     : "Loading");
    }

    function groupByWeek(rows) {
      var weeks = [];
      var byWeek = {};
      rows.forEach(function (r) {
        if (!byWeek[r.week_key]) { byWeek[r.week_key] = []; weeks.push(r.week_key); }
        byWeek[r.week_key].push(r);
      });
      return { weeks: weeks, byWeek: byWeek };
    }

    /* Signs whatever the open view shows and has not been signed yet, then
       draws again. URLs are signed for an hour; start again well before that. */
    function signVisible(rows) {
      if (Date.now() - signedAt > 50 * 60 * 1000) { signed = {}; signedAt = Date.now(); }
      var unsigned = rows.filter(function (r) { return !(framePath(r) in signed); });
      if (unsigned.length) {
        signFrames(unsigned.map(framePath)).then(function () {
          if (panel === "spotlight") render();
        }).catch(function () {});
      }
    }

    function renderSpotlight(host) {
      var views = el("div", "spot__views");
      [["waiting", "Waiting"], ["published", "Published"]].forEach(function (v) {
        var b = el("button", "btn", v[1]);
        b.setAttribute("aria-pressed", String(spotView === v[0]));
        b.addEventListener("click", function () {
          if (spotView === v[0]) return;
          spotView = v[0];
          say($("panel-status"), "");
          render();
        });
        views.appendChild(b);
      });
      host.appendChild(views);
      if (spotView === "published") renderSpotlightPublished(host, data.spotlightPublished);
      else renderSpotlightWaiting(host, data.spotlight);
    }

    /* What went out, newest week first, each week in strip order. Any frame
       still showing can be removed; a removed one stays listed, flagged. */
    function renderSpotlightPublished(host, rows) {
      var g = groupByWeek(rows);
      $("page-sub").textContent = g.weeks.length
        ? (g.weeks.length === 1 ? "The last published week" : "The last " + g.weeks.length + " published weeks")
        : "";
      if (!g.weeks.length) {
        host.appendChild(el("div", "empty", "Nothing has been published yet."));
        return;
      }
      signVisible(rows);

      g.weeks.forEach(function (wk) {
        var list = g.byWeek[wk];
        var showing = list.filter(function (r) { return !r.removed_at; });

        var head = el("div", "spot__week");
        var h = el("div", "sect", weekLabel(wk).replace(/^the w/, "W"));
        h.appendChild(el("span", "sect__note",
          "published " + dayLabel(list[0].published_at) + ", " + plural(showing.length, "frame") + " showing"
          + (list.length > showing.length ? ", " + (list.length - showing.length) + " removed" : "")));
        head.appendChild(h);
        host.appendChild(head);

        list.forEach(function (r) {
          var c = el("div", "card" + (r.removed_at ? " card--removed" : " card--chosen"));
          c.appendChild(frameNode(r));

          var main = el("div", "card__main");
          var t = el("div", "card__title", "@" + (r.username || "unknown"));
          if (r.removed_at) t.appendChild(el("span", "pill pill--bad", "removed"));
          if (r.hidden) t.appendChild(el("span", "pill pill--bad", "hidden"));
          if (r.covered) t.appendChild(el("span", "pill pill--bad", "covered"));
          if (r.tagged) t.appendChild(el("span", "pill pill--bad", "tagged"));
          if (r.hidden_from_discovery) t.appendChild(el("span", "pill pill--bad", "hidden from discovery (App Review?)"));
          if (r.blocked_with_owner) t.appendChild(el("span", "pill pill--bad", "block with you"));
          main.appendChild(t);
          main.appendChild(el("div", "card__meta", r.removed_at
            ? "Removed " + dayLabel(r.removed_at) + ", posted " + dayLabel(r.post_created_at)
            : "Posted " + dayLabel(r.post_created_at)));
          if (r.caption) main.appendChild(el("div", "card__note", r.caption));
          c.appendChild(main);

          var acts = el("div", "card__actions");
          if (!r.removed_at) {
            var remove = el("button", "btn", "Remove");
            remove.addEventListener("click", function () {
              if (!confirm("Remove @" + (r.username || "unknown") + "'s frame from " + weekLabel(wk)
                           + "? It leaves Spotlight for everyone. Their badge stays. This cannot be undone.")) return;
              spotAct(c, "remove_spotlight_entry", { p_post_id: r.post_id });
            });
            acts.appendChild(remove);
          }
          c.appendChild(acts);
          host.appendChild(c);
        });
      });
    }

    /* One Spotlight card as the Waiting view draws it: the frame, the handle, the
       flags, the day put up. `acts` is false for the open week, where nothing can
       be chosen or removed from here (choose is refused on an open week anyway). */
    function waitingCard(r, wk, chosenCount, acts) {
      var c = el("div", "card" + (r.chosen_at && !r.removed_at ? " card--chosen" : "")
                               + (r.removed_at ? " card--removed" : ""));
      c.appendChild(frameNode(r));

      var main = el("div", "card__main");
      var t = el("div", "card__title", "@" + (r.username || "unknown"));
      if (r.removed_at) t.appendChild(el("span", "pill", "removed"));
      if (r.chosen_at && !r.removed_at) t.appendChild(el("span", "pill", "chosen"));
      if (r.hidden) t.appendChild(el("span", "pill pill--bad", "hidden"));
      if (r.covered) t.appendChild(el("span", "pill pill--bad", "covered"));
      if (r.tagged) t.appendChild(el("span", "pill pill--bad", "tagged"));
      if (r.hidden_from_discovery) t.appendChild(el("span", "pill pill--bad", "hidden from discovery (App Review?)"));
      if (r.blocked_with_owner) t.appendChild(el("span", "pill pill--bad", "block with you"));
      main.appendChild(t);
      main.appendChild(el("div", "card__meta", "Put up " + dayLabel(r.put_up_at)
        + ", posted " + dayLabel(r.post_created_at)));
      /* The caption goes public with the frame, so it is part of the choice. */
      if (r.caption) main.appendChild(el("div", "card__note", r.caption));
      c.appendChild(main);
      if (!acts) return c;

      var box = el("div", "card__actions");
      /* What choose refuses. A frame already chosen can always be unchosen, so a
         flag that appears after the choice never strands it. */
      var blocked = r.hidden || r.covered || r.tagged || r.blocked_with_owner;
      var toggle = el("button", r.chosen_at ? "btn btn--go" : "btn", r.chosen_at ? "Chosen" : "Choose");
      toggle.title = r.chosen_at ? "Chosen. Press to unchoose." : "Choose this frame";
      toggle.disabled = !!r.removed_at || (!r.chosen_at && (!!blocked || chosenCount >= 6));
      toggle.addEventListener("click", function () {
        spotAct(c, r.chosen_at ? "unchoose_spotlight_entry" : "choose_spotlight_entry", { p_post_id: r.post_id });
      });
      box.appendChild(toggle);
      if (!r.removed_at) {
        var remove = el("button", "btn", "Remove");
        remove.addEventListener("click", function () {
          if (!confirm("Remove @" + (r.username || "unknown") + "'s frame from " + weekLabel(wk)
                       + "? It cannot be chosen again. This cannot be undone.")) return;
          spotAct(c, "remove_spotlight_entry", { p_post_id: r.post_id });
        });
        box.appendChild(remove);
      }
      c.appendChild(box);
      return c;
    }

    /* "Monday 4:00 AM" in the owner's own time zone. en-US so it is always the
       12-hour h:mm AM/PM shape; newer ICU puts a narrow no-break space before
       AM/PM, which is made a plain space. */
    function closesLabel(iso) {
      var d = new Date(iso);
      return d.toLocaleDateString("en-US", { weekday: "long" }) + " "
        + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true })
            .replace(/[  ]/g, " ");
    }

    /* The open week, read-only: no Choose, Remove, Skip or Publish. */
    function renderSpotlightOpen(host) {
      if (!spotOpen) return;
      if (spotOpen.error) {
        host.appendChild(el("div", "card__meta", "Couldn't load this week."));
        return;
      }
      var head = el("div", "spot__week");
      var h = el("div");
      h.appendChild(el("div", "sect", "This week, " + weekLabel(spotOpen.key)
        + (spotOpen.closesAt ? ", open until " + closesLabel(spotOpen.closesAt) : "")));
      h.appendChild(el("div", "card__meta", "You can choose from these once the week closes. They move to Waiting then."));
      head.appendChild(h);
      host.appendChild(head);
      if (!spotOpen.rows.length) {
        host.appendChild(el("div", "empty", "Nothing put up this week yet."));
        return;
      }
      spotOpen.rows.forEach(function (r) {
        host.appendChild(waitingCard(r, spotOpen.key, 0, false));
      });
    }

    function renderSpotlightWaiting(host, rows) {
      var g = groupByWeek(rows);
      var weeks = g.weeks;
      var byWeek = g.byWeek;
      $("page-sub").textContent = weeks.length ? plural(weeks.length, "closed week") + " waiting" : "";
      /* One signing batch for both sections. */
      signVisible((spotOpen && spotOpen.rows ? spotOpen.rows : []).concat(rows));
      renderSpotlightOpen(host);
      if (!weeks.length) {
        host.appendChild(el("div", "empty", "No closed week is waiting yet."));
        return;
      }

      /* Newest week first: the server already orders it that way, and a week is
         only listed while it is closed and unpublished. */
      weeks.forEach(function (wk) {
        var list = byWeek[wk];
        var live = list.filter(function (r) { return !r.removed_at; });
        var chosen = live.filter(function (r) { return r.chosen_at; });

        var head = el("div", "spot__week");
        var h = el("div", "sect", weekLabel(wk).replace(/^the w/, "W"));
        h.appendChild(el("span", "sect__note",
          plural(live.length, "frame") + " put up, " + chosen.length + " of 6 chosen"));
        head.appendChild(h);
        var publish = el("button", "btn btn--go", "Publish to everyone");
        publish.disabled = chosen.length === 0;
        publish.addEventListener("click", function () { publishWeek(publish, wk, chosen.length); });
        var skip = el("button", "btn", "Skip this week");
        skip.addEventListener("click", function () { skipWeek(skip, wk); });
        var headActs = el("div", "spot__week-acts");
        headActs.appendChild(skip);
        headActs.appendChild(publish);
        head.appendChild(headActs);
        host.appendChild(head);

        list.forEach(function (r) {
          host.appendChild(waitingCard(r, wk, chosen.length, true));
        });
      });
    }

    // ---- Analytics rendering -----------------------------------------------

    function statCard(n, label, sub, warn) {
      var c = el("div", "stat" + (warn ? " stat--warn" : ""));
      c.appendChild(el("div", "stat__n", n === null || n === undefined ? "\u2013" : String(n)));
      c.appendChild(el("div", "stat__l", label));
      if (sub) c.appendChild(el("div", "stat__sub", sub));
      return c;
    }

    function statRow(cards) {
      var g = el("div", "stats");
      cards.forEach(function (c) { g.appendChild(c); });
      return g;
    }

    function section(host, title, note) {
      var h = el("div", "sect", title);
      if (note) h.appendChild(el("span", "sect__note", note));
      host.appendChild(h);
    }

    /* Bars are sized against the largest value present, not against a cohort
       total. A funnel whose first step is 20 of 21 would otherwise render as
       twenty near-identical full bars, which is exactly the comparison the
       chart exists to make visible. */
    function bars(host, rows) {
      var max = rows.reduce(function (m, r) { return Math.max(m, r.value); }, 0) || 1;
      var box = el("div", "bars");
      rows.forEach(function (r) {
        var b = el("div", "bar" + (r.dim ? " bar--dim" : ""));
        b.appendChild(el("div", "bar__l", r.label));
        var track = el("div", "bar__track");
        var fill = el("div", "bar__fill");
        fill.style.width = Math.round((r.value / max) * 100) + "%";
        track.appendChild(fill);
        b.appendChild(track);
        b.appendChild(el("div", "bar__n", r.note || String(r.value)));
        box.appendChild(b);
      });
      host.appendChild(box);
    }

    function table(host, headers, rows) {
      var wrap = el("div", "tblwrap");
      var t = el("table", "tbl");
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      headers.forEach(function (h) {
        var th = document.createElement("th");
        /* An object header carries its alignment, so a right-aligned column's label sits over its
           numbers instead of stranded at the far left of the column. */
        if (h && typeof h === "object") { th.textContent = h.text; th.className = h.cls || ""; }
        else { th.textContent = String(h); }
        hr.appendChild(th);
      });
      hr.appendChild(el("th", "spacer", ""));
      thead.appendChild(hr);
      t.appendChild(thead);
      var tb = document.createElement("tbody");
      rows.forEach(function (cells) {
        var tr = document.createElement("tr");
        cells.forEach(function (cell) {
          var td = document.createElement("td");
          if (cell && typeof cell === "object") {
            td.textContent = cell.text;
            if (cell.cls) td.className = cell.cls;
          } else {
            td.textContent = String(cell);
          }
          tr.appendChild(td);
        });
        tr.appendChild(el("td", "spacer", ""));
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      wrap.appendChild(t);
      host.appendChild(wrap);
    }

    function pct(a, b) { return b ? Math.round((a / b) * 100) + "%" : "\u2013"; }

    function renderStats(host) {
      var d = stats[panel];
      if (d === null) {
        host.appendChild(el("div", "empty", "Still loading."));
        return;
      }
      $("page-sub").textContent = "";

      if (panel === "overview") {
        var t = d.totals || {}, wk = d.week || {}, at = d.attention || {};
        /* One headline metric: this week's number, with last week's beside it and an arrow.
           Up is not automatically good and down is not automatically bad for every metric, so
           the arrow only ever states the direction; it never colours the card. The red cards
           are reserved for the standing facts below, which ARE unambiguously "act on this". */
        function metric(m, label) {
          m = m || {};
          var now = Number(m.now) || 0, prev = Number(m.prev) || 0, diff = now - prev;
          var tone = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
          var arrow = diff > 0 ? "\u25B2 +" + diff
                    : diff < 0 ? "\u25BC " + diff
                    : "\u2013 no change";
          var c = el("div", "stat");
          c.appendChild(el("div", "stat__n", String(now)));
          c.appendChild(el("div", "stat__l", label));
          c.appendChild(el("div", "stat__sub stat__delta--" + tone,
                            arrow + "  \u00b7  " + prev + " the week before"));
          return c;
        }
        section(host, "This week", "the last 7 days, each number against the 7 before it");
        host.appendChild(statRow([
          metric(wk.new_users, "new users"),
          metric(wk.active_shooters, "people who shot"),
          metric(wk.shots, "shots")
        ]));
        host.appendChild(statRow([
          metric(wk.reveals, "reveals watched"),
          metric(wk.posts, "posts shared"),
          metric(wk.invites_redeemed, "invites redeemed")
        ]));

        section(host, "New users, 14 days", "the growth line, oldest day first");
        bars(host, (d.signups_daily || []).map(function (r) {
          return { label: r.day, value: r.n, dim: r.n === 0,
                   note: r.n === 1 ? "1 signup" : r.n + " signups" };
        }));

        section(host, "Invites by surface",
                "the reveal experiment: which of the three placements gets used");
        var src = d.invite_sources || {};
        var srcTotal = (src.profile || 0) + (src.feed || 0) + (src.reveal || 0);
        bars(host, [
          { label: "Profile sheet",    value: src.profile || 0 },
          { label: "Feed empty state", value: src.feed || 0 },
          { label: "Reveal close",     value: src.reveal || 0 }
        ].map(function (r) {
          return { label: r.label, value: r.value, dim: r.value === 0,
                   note: r.value + (srcTotal ? "  ·  " + pct(r.value, srcTotal) : "") };
        }));
        if (!srcTotal) {
          host.appendChild(el("div", "empty", "No source-tagged shares yet. This fills in as 1.5.1 rolls out."));
        }

        section(host, "All time", "the ground the week moves against");
        host.appendChild(statRow([
          statCard(t.users, "users"),
          statCard(t.ever_shot, "have ever shot",
                   t.users ? pct(t.ever_shot, t.users) + " of everyone" : ""),
          statCard(t.photos, "photos"),
          statCard(t.rolls, "rolls")
        ]));

        section(host, "Worth acting on", "the standing facts, not this week's motion");
        host.appendChild(statRow([
          statCard(at.never_asked_notifications, "never asked about notifications",
                   "cannot be pulled back by a reveal", at.never_asked_notifications > 0),
          statCard(at.invite_senders_ever, "have ever invited anyone",
                   t.users ? "of " + t.users + ", the accounts growth runs through" : "",
                   t.users && at.invite_senders_ever < t.users * 0.25),
          statCard(at.days_since_last_roll === null ? "–" : at.days_since_last_roll,
                   "days since the last roll",
                   "rolls are the stated differentiator",
                   at.days_since_last_roll !== null && at.days_since_last_roll > 7)
        ]));
        return;
      }

      if (panel === "traffic") {
        /* Every breakdown comes back the same shape, keyed by its own dimension:
           an aggregate by country returns { country: "US", count, visitors }, by
           deviceType returns { deviceType: "mobile", ... }. Reading whichever key
           is not count/visitors/timestamp lets one renderer draw all eight. */
        function labelOf(row) {
          for (var k in row) {
            if (k !== "count" && k !== "pageviews" && k !== "visitors" && k !== "timestamp") {
              return row[k];
            }
          }
          return "";
        }
        /* The visits dataset names this column `pageviews`; the events dataset names
           the same idea `count`. Reading only one of them put the string "undefined"
           in every row of every chart, and reading it as a LABEL (before pageviews
           was excluded above) could put a raw number where the country should be. */
        function views(row) {
          return row.pageviews !== undefined ? row.pageviews : row.count;
        }
        /* A null dimension is one that did not load, and it is already named in
           the note at the foot of the panel. Drawing an empty chart for it would
           claim the answer is zero. */
        function breakdown(title, note, rows, blank) {
          if (!rows) return;
          section(host, title, note);
          if (!rows.length) { host.appendChild(el("div", "empty", "Nothing yet.")); return; }
          bars(host, rows.map(function (r) {
            return { label: String(labelOf(r) || blank || "unknown"),
                     value: r.visitors,
                     note: r.visitors + " people · " + views(r) + " views" };
          }));
        }

        var tot = d.total || {};
        /* Sorted before slicing rather than trusted: the last seven rows are only
           the last seven days if the series came back in date order. */
        var series = (d.daily || []).slice().sort(function (a, b) {
          return String(a.timestamp) < String(b.timestamp) ? -1 : 1;
        });
        var week = series.slice(-7);
        var wV = week.reduce(function (n, r) { return n + r.visitors; }, 0);
        var wP = week.reduce(function (n, r) { return n + views(r); }, 0);

        host.appendChild(statRow([
          statCard(tot.visitors, "people, last 30 days"),
          statCard(tot.pageviews, "pageviews, last 30 days"),
          statCard(wV, "people, last 7 days"),
          statCard(wP, "pageviews, last 7 days")
        ]));

        if (d.daily) {
          section(host, "Daily", "people per day, newest last");
        }
        if (d.daily && !series.length) {
          /* An empty series drew an empty bordered box, which reads as a chart
             that failed to paint rather than as a quiet month. */
          host.appendChild(el("div", "empty", "No visits in this window yet."));
        } else if (d.daily) {
          bars(host, series.map(function (r) {
            return { label: String(r.timestamp).slice(0, 10), value: r.visitors,
                     note: r.visitors + " people · " + views(r) + " views" };
          }));
        }

        /* Referrers first: it is the question this panel was built to answer, and
           the empty hostname is the large and interesting bucket rather than a
           gap, so it is named instead of dropped. */
        breakdown("Where they came from", "referring hostname over 30 days",
                  d.referrers, "direct or unknown");
        breakdown("Campaign source", "utm_source", d.utmSource, "no tag");
        breakdown("Campaign", "utm_campaign", d.utmCampaign, "no tag");
        breakdown("Pages", "invite codes are stripped before anything is sent", d.pages);
        breakdown("Country", "the finest location Vercel reports", d.countries);
        breakdown("Device", null, d.devices);
        breakdown("Operating system", null, d.systems);
        breakdown("Browser", null, d.browsers);

        host.appendChild(el("div", "card__note",
          "Country is as precise as this gets. Vercel Web Analytics derives it at the edge and "
          + "never exposes a city, a region or an IP to us, which is also why the site needs no "
          + "cookie banner: nothing is stored on the visitor's device and nobody is followed "
          + "between visits. \"People\" is Vercel's own visitor estimate, not a count of "
          + "accounts, and it cannot be joined to anything in the app. This page is not itself "
          + "tracked, so your own admin visits never appear above."));

        if ((d.failed || []).length) {
          var utmOnly = d.failed.every(function (n) { return n.indexOf("utm") === 0; });
          var f = el("div", "card__note",
            utmOnly
              ? "Campaign source and campaign are empty because UTM breakdowns need Vercel's paid "
                + "Web Analytics Plus, which this project is not on. Nothing is wrong with the "
                + "tags themselves: put utm_source on a link and \"Where they came from\" still "
                + "shows the referring host. Everything else above is unaffected."
              : "Did not load: " + d.failed.join(", ") + ". The rest of the panel is unaffected.");
          f.style.borderLeft = "3px solid #b45309";
          host.appendChild(f);
        }
        return;
      }

      if (panel === "pulse") {
        var st = stats.storage || {};
        var days = d || [];
        var recent = days.slice(-7);
        var shots7 = recent.reduce(function (n, r) { return n + r.shots; }, 0);
        var posts7 = recent.reduce(function (n, r) { return n + r.posts; }, 0);
        host.appendChild(statRow([
          statCard(shots7, "shots, last 7 days"),
          statCard(posts7, "posts, last 7 days"),
          statCard(st.photos, "photos, all time"),
          statCard(st.rolls_developing, "rolls developing now")
        ]));
        section(host, "Daily", "shots per day, newest last");
        bars(host, days.map(function (r) {
          return { label: r.day, value: r.shots,
                   note: r.shots + " shots \u00b7 " + r.shooters + " people" };
        }));
        section(host, "Ceilings", "the two numbers that end the current plan's free ride");
        var storGB = (st.storage_bytes || 0) / 1073741824;
        var paceGBwk = ((st.storage_bytes_14d || 0) / 1073741824) / 2;
        var weeksTo100 = paceGBwk > 0 ? Math.round((100 - storGB) / paceGBwk) : null;
        /* Egress is MODELLED: sessions times an assumed 9 MB payload (measured card and thumb
           sizes for a typical feed pass). Real egress lives in Supabase's logs and no API
           exposes it, so this is a pace indicator, not a bill. */
        var egressGBmo = ((st.app_opens_7d || 0) / 7) * 30 * 9 / 1024;
        host.appendChild(statRow([
          statCard(storGB.toFixed(2) + " GB", "photo storage, measured",
                   "of 100 GB included", false),
          statCard(paceGBwk.toFixed(2) + " GB/wk", "growth pace, last 14 days",
                   weeksTo100 !== null ? "about " + weeksTo100 + " weeks to the ceiling at this pace" : "",
                   weeksTo100 !== null && weeksTo100 < 26),
          statCard(egressGBmo.toFixed(1) + " GB/mo", "egress pace, modelled",
                   "of 250 GB included; 9 MB per session assumed", egressGBmo > 100)
        ]));
        section(host, "Renditions missing",
                "each one falls back to the full master everywhere it appears, forever");
        host.appendChild(statRow([
          statCard(st.missing_thumb, "no thumbnail",
                   st.photos ? pct(st.missing_thumb, st.photos) + " of the library" : "",
                   st.missing_thumb > 0),
          statCard(st.missing_feed, "no feed rendition",
                   st.photos ? pct(st.missing_feed, st.photos) + " of the library" : "",
                   st.missing_feed > 0),
          statCard(st.reactions, "reactions"),
          statCard(st.comments, "comments")
        ]));
        return;
      }

      if (panel === "funnel") {
        var since = String(d.since || "").slice(0, 10);
        section(host, "Activation",
                "signups since " + since + (d.derived ? ", chosen automatically" : ""));
        host.appendChild(statRow([statCard(d.cohort_size, "in this cohort")]));
        bars(host, (d.steps || []).map(function (st2) {
          return {
            label: st2.step.replace(/_/g, " "),
            value: st2.reached,
            dim: !st2.comparable,
            note: st2.comparable
              ? st2.reached + "  " + pct(st2.reached, d.cohort_size)
              : "not comparable"
          };
        }));
        var dim = (d.steps || []).filter(function (x) { return !x.comparable; });
        if (dim.length) {
          host.appendChild(el("div", "card__note",
            "Dimmed steps began logging after this cohort started, so their counts are a floor "
            + "rather than a measurement. They stop being dimmed a week after they ship."));
        }
        return;
      }

      if (panel === "reach") {
        host.appendChild(statRow([
          statCard(d.accounts, "accounts"),
          statCard(d.with_token, "can be pushed", pct(d.with_token, d.accounts) + " of accounts"),
          statCard(d.authorized, "said yes"),
          statCard(d.denied, "said no"),
          statCard(d.never_asked, "never asked",
                   "reachable, if the prompt found them", d.never_asked > 0)
        ]));
        host.appendChild(el("div", "card__note",
          "Never asked is the absence of both permission events, not a state anyone records. "
          + "It counts people the prompt has not reached, which is a different problem from a "
          + "refusal and the only one of the two worth acting on. It stays high until everyone "
          + "has opened a build that logs the decision."));
        section(host, "Campaigns sent");
        var camps = stats.campaigns || [];
        if (!camps.length) {
          host.appendChild(el("div", "empty", "None yet."));
        } else {
          table(host, ["Campaign", { text: "Delivered", cls: "num" },
                       { text: "Shot since", cls: "num" }, "First sent"],
            camps.map(function (c) {
              return [{ text: c.campaign, cls: "who" },
                      { text: c.delivered + " of " + c.claimed, cls: "num" },
                      { text: String(c.shot_after), cls: "num" },
                      String(c.first_sent || "").slice(0, 16).replace("T", " ")];
            }));
        }
        return;
      }

      if (panel === "versions") {
        var latest = (d.versions || []).length ? d.versions[0] : null;
        host.appendChild(statRow([
          statCard(d.accounts, "accounts"),
          statCard(d.reported, "reporting a version",
                   pct(d.reported, d.accounts) + " of accounts"),
          statCard(latest ? latest.users : 0,
                   latest ? "on " + latest.version : "on the top version"),
          statCard(d.unreported, "not yet reported",
                   "no launch since reporting shipped", d.unreported > 0)
        ]));
        section(host, "By version", "every launch stamps the row, so last seen is honest");
        var vs = d.versions || [];
        if (!vs.length) {
          host.appendChild(el("div", "empty", "Nobody has reported yet."));
        } else {
          table(host, ["Version", { text: "Users", cls: "num" }, "Builds", "Last seen"],
            vs.map(function (v) {
              return [{ text: v.version, cls: "who" },
                      { text: String(v.users), cls: "num" },
                      String(v.builds || ""),
                      String(v.last_seen || "").slice(0, 16).replace("T", " ")];
            }));
        }
        var stale = d.unreported_active || [];
        if (stale.length) {
          section(host, "Active on a build too old to report",
                  "a reaction, comment, post or photo in the last 30 days, and no census row: automatic updates are off; a text from you does more than a push");
          table(host, ["Who", "Last activity"],
            stale.map(function (s) {
              return [{ text: s.username, cls: "who" },
                      String(s.last_activity || "").slice(0, 16).replace("T", " ")];
            }));
        }
        host.appendChild(el("div", "card__note",
          "This is a census of accounts that opened a reporting build (1.4.3+), not App Store "
          + "Connect's opt-in sample. Not yet reported mixes people on older versions with "
          + "people who simply have not opened the app; it drains as they launch, and only "
          + "what remains after a week or two is really behind."));
        return;
      }

      if (panel === "stuck") {
        var groups = [
          ["never_shot", "Never taken a frame", "zero rows in photos, not zero posts"],
          ["shot_never_posted", "Shot, never posted", "has frames, none of them public"],
          ["deck_sitting", "Deck sitting two days or more",
           "actively shooting today is excluded, that deck is just their afternoon"]
        ];
        groups.forEach(function (g) {
          var rows = d[g[0]] || [];
          section(host, g[1] + " (" + rows.length + ")", g[2]);
          if (!rows.length) { host.appendChild(el("div", "empty", "Nobody.")); return; }
          var reachable = rows.filter(function (r) { return r.reachable; }).length;
          host.appendChild(el("div", "stat__sub",
            reachable + " of " + rows.length + " can be reached by push"));
          table(host,
            g[0] === "never_shot" ? ["Who", "Joined", "Reachable"]
              : g[0] === "shot_never_posted"
                ? ["Who", { text: "Photos", cls: "num" }, { text: "To sort", cls: "num" }, "Reachable"]
                : ["Who", { text: "To sort", cls: "num" }, "Oldest", "Reachable"],
            rows.map(function (r) {
              if (g[0] === "never_shot") {
                return [{ text: r.username, cls: "who" }, r.joined, r.reachable ? "yes" : "no"];
              }
              if (g[0] === "shot_never_posted") {
                return [{ text: r.username, cls: "who" }, { text: String(r.photos), cls: "num" },
                        { text: String(r.to_sort), cls: "num" }, r.reachable ? "yes" : "no"];
              }
              return [{ text: r.username, cls: "who" }, { text: String(r.to_sort), cls: "num" },
                      r.oldest, r.reachable ? "yes" : "no"];
            }));
        });
        return;
      }

      if (panel === "retention") {
        section(host, "By signup week",
                "a return is a shot, a post or a reaction on that day, not an app launch");
        table(host, ["Week", { text: "Size", cls: "num" }, { text: "Day 1", cls: "num" },
                     { text: "Day 7", cls: "num" }, { text: "Day 14", cls: "num" }],
          (d || []).map(function (r) {
            return [r.week, { text: String(r.size), cls: "num" },
                    { text: r.d1 + " (" + pct(r.d1, r.size) + ")", cls: "num" },
                    { text: r.d7 + " (" + pct(r.d7, r.size) + ")", cls: "num" },
                    { text: r.d14 + " (" + pct(r.d14, r.size) + ")", cls: "num" }];
          }));
        host.appendChild(el("div", "card__note",
          "The newest weeks cannot have a day 7 or day 14 yet, so a zero there is the calendar, "
          + "not a verdict."));
        return;
      }
    }

    function counts() {
      [["invites", "c-invites"], ["photos", "c-photos"],
       ["users", "c-users"], ["feedback", "c-feedback"], ["spotlight", "c-spotlight"]].forEach(function (p) {
        /* Spotlight counts frames still in play, not rows: a removed frame stays
           listed so the week reads true, but it is not waiting on anyone. */
        var n = p[0] === "spotlight"
          ? data.spotlight.filter(function (r) { return !r.removed_at; }).length
          : data[p[0]].length;
        var node = $(p[1]);
        node.textContent = n;
        node.setAttribute("data-any", String(n > 0));
      });
    }

    /* Refetches after every action rather than editing the row in place. The
       queues are short, and the server is the only thing that knows the real
       state, so a refetch cannot drift the way a local edit can. */
    async function act(cardEl, name, body) {
      Array.prototype.forEach.call(cardEl.querySelectorAll("button"), function (b) { b.disabled = true; });
      try {
        await rpc(name, body);
        say($("panel-status"), "");
        await load();
      } catch (err) {
        say($("panel-status"), "That did not go through: " + String(err.message || err).slice(0, 140), "bad");
        Array.prototype.forEach.call(cardEl.querySelectorAll("button"), function (b) { b.disabled = false; });
      }
    }

    /* The current open week: its key from own_spotlight_entry (one row for any
       signed-in caller), then that week's entries from the owner's queue. Its
       own failure is quiet; it never marks the rest of the panel broken. */
    async function openWeek() {
      var own = await rpc("own_spotlight_entry");
      var row = Array.isArray(own) ? own[0] : own;
      if (!row || !row.week_key) throw new Error("no open week");
      var key = String(row.week_key).slice(0, 10);
      var rows = await rpc("list_spotlight_queue", { p_week_key: key });
      return { key: key, closesAt: row.week_closes_at || null, rows: rows || [] };
    }

    /* allSettled, not all. These are independent queues, and with Promise.all
       a single failing one takes the whole dashboard down with it: a function not
       yet deployed, or one renamed on the server, would leave the owner staring at
       a blank page with every other healthy queue behind it. Each queue now
       fails on its own and says so. */
    async function load() {
      var names = ["list_invite_requests", "list_photo_reports", "list_user_reports", "list_feedback",
                   "list_spotlight_queue", "list_spotlight_published_admin"];
      var keys = ["invites", "photos", "users", "feedback", "spotlight", "spotlightPublished"];
      /* Analytics ride the same allSettled pass. They are separate RPCs so one
         heavy or not-yet-deployed query cannot take the queues down with it,
         which is the whole reason this was allSettled to begin with. */
      var statNames = ["admin_overview", "admin_pulse", "admin_funnel", "admin_reach", "admin_stuck",
                       "admin_retention", "admin_storage", "admin_campaigns", "admin_versions"];
      /* One key longer than statNames: traffic is the trailing entry, because it
         is a plain fetch rather than an RPC and is appended to the promise list
         below. The two must stay aligned, so anything new goes in BOTH arrays,
         above traffic, and never between them. */
      var statKeys = ["overview", "pulse", "funnel", "reach", "stuck", "retention", "storage", "campaigns",
                      "versions", "traffic"];

      /* The open week rides last and is popped off before anything else reads
         `settled`, so the queue and stat slices below keep their alignment. */
      var settled = await Promise.allSettled(
        names.map(function (n) { return rpc(n); })
          .concat(statNames.map(function (n) { return rpc(n); }))
          .concat([traffic()])
          .concat([openWeek()]));
      var openResult = settled.pop();
      spotOpen = openResult.status === "fulfilled" ? openResult.value : { error: true };

      var broken = [];
      settled.slice(0, names.length).forEach(function (result, i) {
        if (result.status === "fulfilled") {
          data[keys[i]] = result.value || [];
        } else {
          data[keys[i]] = [];
          broken.push(TITLES[keys[i]]);
        }
      });
      settled.slice(names.length).forEach(function (result, i) {
        /* A null here is the owner gate saying no, not an empty dataset. Left as
           null so the panel says "still loading" rather than drawing a confident
           page of zeroes at somebody who is not allowed to see it. */
        stats[statKeys[i]] = result.status === "fulfilled" ? result.value : null;
        if (result.status !== "fulfilled") broken.push(statKeys[i]);
      });

      say($("panel-status"),
          broken.length ? "Could not load: " + broken.join(", ") : "",
          broken.length ? "bad" : undefined);

      counts();
      render();
      r2Banner();
    }

    /* The R2 tripwire's passive face: a banner above every panel when a migration trigger has
       fired, computed from the same numbers the weekly workflow checks. Quiet means absent. */
    function r2Banner() {
      var st = stats.storage;
      var old = document.getElementById("r2-banner");
      if (old) old.remove();
      if (!st) return;
      var gb = (st.storage_bytes || 0) / 1073741824;
      var paceWk = ((st.storage_bytes_14d || 0) / 1073741824) / 2;
      var weeks = paceWk > 0 ? (100 - gb) / paceWk : 9999;
      var egress = ((st.app_opens_7d || 0) / 7) * 30 * 9 / 1024;
      var fired = [];
      if (weeks < 26) fired.push("storage ceiling about " + Math.round(weeks) + " weeks away");
      if (egress > 100) fired.push("modelled egress " + egress.toFixed(0) + " GB/mo");
      if ((st.app_opens_7d || 0) > 2000) fired.push(st.app_opens_7d + " opens this week");
      if (!fired.length) return;
      var b = el("div", "card__note", "Time to migrate photos to R2: " + fired.join("; ")
        + ". The runbook is docs/R2_MIGRATION.md; the owner step is about 20 minutes.");
      b.id = "r2-banner";
      b.style.borderLeft = "3px solid #b45309";
      b.style.margin = "0 0 16px";
      b.style.fontWeight = "600";
      document.querySelector(".content").prepend(b);
    }

    async function enter() {
      /* Asked first, and for the same reason the RPCs check it: without this a
         non-owner would land on three empty queues, which looks like a working
         dashboard on a quiet day rather than a refusal. */
      var owner = await rpc("is_owner");
      if (owner !== true) {
        signOut();
        say($("gate-status"), "That account is not the owner.", "bad");
        return;
      }
      hide($("gate")); show($("side")); show($("content"));
      await load();
    }

    if (token) { enter().catch(function () { signOut(); }); }
  })();
  </script>
</body>
