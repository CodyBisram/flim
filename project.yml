name: Flim

options:
  bundleIdPrefix: com.flim
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

# Two apps from one codebase (2026-10-27). Debug and Release build the App Store app against the
# production database, exactly as before. Debug-Beta and Release-Beta build FLIM Beta: its own
# bundle id, App Group, URL scheme and Supabase project, installed beside FLIM and shipped to its
# own TestFlight, for v2 work that must never touch production. Each target lists the beta configs
# beside Debug and Release with the same signing settings; the profile names follow FLIM_BUNDLE_ID.
configs:
  Debug: debug
  Release: release
  Debug-Beta: debug
  Release-Beta: release

# Read at runtime from each target's Info.plist by FlimEnvironment.swift, and used below for bundle
# ids, App Groups, display names and profile names.
settings:
  base:
    FLIM_ENVIRONMENT: production
    FLIM_BUNDLE_ID: com.flim.app
    FLIM_DISPLAY_NAME: FLIM
    FLIM_APP_GROUP: group.com.flim.app
    # Kept as com.lapse.app to match the Supabase auth redirect allowlist.
    FLIM_URL_SCHEME: com.lapse.app
    FLIM_SUPABASE_URL: https://wxvwamwrjlrvqmuaafjv.supabase.co
    FLIM_SUPABASE_KEY: sb_publishable_ze8KEytcVzvKOijlUQ8Kfw_nb3kJ-V4
  configs:
    Beta:
      FLIM_ENVIRONMENT: beta
      FLIM_BUNDLE_ID: com.flim.app.beta
      FLIM_DISPLAY_NAME: FLIM Beta
      FLIM_APP_GROUP: group.com.flim.app.beta
      FLIM_URL_SCHEME: com.flim.app.beta
      # FLIM Beta's own Supabase project, once it exists. Until then a beta build stops at launch
      # and says so, rather than reach production (FlimEnvironment refuses production's host too).
      FLIM_SUPABASE_URL: ""
      FLIM_SUPABASE_KEY: ""

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Flim:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Flim
    entitlements:
      path: Flim/Flim.entitlements
      properties:
        # Resolved per build config: development (Debug) / production (Release).
        # Distribution/TestFlight builds require production, so this must vary.
        aps-environment: $(APS_ENVIRONMENT)
        # Shared container for the home-screen widget. The extension cannot read the app's
        # sandbox, so the snapshot the widget renders crosses through this group; it must be
        # present on BOTH targets and must match `WidgetStore.appGroup` exactly.
        com.apple.security.application-groups:
          - $(FLIM_APP_GROUP)
        # Makes https://flim-app.com/join/CODE open the app directly instead of dead-ending on
        # the web landing page. The AASA at /.well-known/apple-app-site-association is already
        # live and correct (DCU7GHRVUQ.com.flim.app, /join/*), so this entitlement is the last
        # piece. It signs ONLY if the match profile carries the Associated Domains capability —
        # enable it on the App ID, then re-run match --force, or the archive fails.
        com.apple.developer.associated-domains:
          - applinks:flim-app.com
    info:
      path: Flim/Info.plist
      properties:
        # Home-screen app name. To rename the app: change FLIM_DISPLAY_NAME + AppInfo.appName.
        CFBundleDisplayName: $(FLIM_DISPLAY_NAME)
        # Which FLIM this is and what it talks to, read by FlimEnvironment.swift.
        FLIMEnvironment: $(FLIM_ENVIRONMENT)
        FLIMSupabaseURL: $(FLIM_SUPABASE_URL)
        FLIMSupabaseKey: $(FLIM_SUPABASE_KEY)
        FLIMAppGroup: $(FLIM_APP_GROUP)
        FLIMURLScheme: $(FLIM_URL_SCHEME)
        # App uses only standard HTTPS (exempt encryption) — declaring this skips
        # the per-build export-compliance prompt so builds reach testers automatically.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Modern launch screen (no storyboard file needed on iOS 14+).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "FLIM uses the camera to take your photos. Shots you send to a shared roll stay hidden until the roll develops."
        NSPhotoLibraryAddUsageDescription: "Save your developed photos to your camera roll."
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # com.lapse.app for the App Store app (see FLIM_URL_SCHEME above).
              - $(FLIM_URL_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLIM_BUNDLE_ID)
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DCU7GHRVUQ
        ENABLE_PREVIEWS: YES
        # iPhone only — a portrait camera app; avoids iPad multitasking requirements.
        TARGETED_DEVICE_FAMILY: "1"
        # Versioning — CI passes CURRENT_PROJECT_VERSION=<next TestFlight build>.
        # 1.0 shipped to the App Store and Apple closes a version's TestFlight train once
        # it's been approved (ASC rejected further 1.0 uploads with "Invalid Pre-Release
        # Train... previously approved version"). Bump this again for the next release.
        MARKETING_VERSION: "1.6.3"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug: &app_debug
          APS_ENVIRONMENT: development
          CODE_SIGN_STYLE: Automatic
        Debug-Beta: *app_debug
        Release: &app_release
          APS_ENVIRONMENT: production
          # Signing lives on the APP TARGET (not global xcargs) so it doesn't
          # leak onto SPM package targets, which reject provisioning profiles.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore $(FLIM_BUNDLE_ID)"
        Release-Beta: *app_release
    dependencies:
      - package: supabase-swift
        product: Supabase
      # The Live Activity widget extension. Its App ID and "match AppStore
      # com.flim.app.RollActivityWidget" profile now exist in the certs repo, so this
      # is embedded and signed alongside the app on every Release archive.
      - target: RollActivityWidget
        embed: true
      # Puts the friend's photo into a push that carries reaction buttons (1.6.3). Its own App ID
      # and "match AppStore com.flim.app.NotificationService" profile, the same one-time setup the
      # widget went through (docs/TESTFLIGHT_SETUP.md, "Adding a new target").
      - target: FlimNotificationService
        embed: true

  RollActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RollActivityWidget
      # Shared with the app target — see the file's own header comment for why this is a second
      # explicit source entry instead of a shared framework.
      - path: Flim/Models/RollRevealAttributes.swift
      # Same reason: the accent the person picked is carried in the activity's content state, and
      # both sides need to turn that name into the same color.
      - path: Flim/Models/FlimAccentPalette.swift
      # The lock-screen card's layout, shared so it can be previewed and screenshotted from the
      # app instead of only ever being seen on a locked device.
      - path: Flim/Models/RollRevealCard.swift
      # What the home-screen widget shows, and the App Group container both sides read it from.
      # Same second-source-entry pattern as the three above.
      - path: Flim/Models/WidgetSnapshot.swift
      # The tokens all three off-app surfaces are drawn from. Shared because the Live Activity
      # card lives in Flim/Models and the home tiles live in the extension, so a hex value
      # defined in either would need a second copy in the other.
      - path: Flim/Models/WidgetTheme.swift
      # Which FLIM this is: the App Group and URL scheme the widget uses come from it.
      - path: Flim/Config/FlimEnvironment.swift
    entitlements:
      path: RollActivityWidget/RollActivityWidget.entitlements
      properties:
        # The other half of the shared container. Same group as the app target above; without it
        # here the extension's own container lookup returns nil and the widget can only ever
        # render its empty state.
        com.apple.security.application-groups:
          - $(FLIM_APP_GROUP)
    info:
      path: RollActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: $(FLIM_DISPLAY_NAME)
        # Same keys as the app's, read by FlimEnvironment.swift from this bundle's own plist.
        FLIMEnvironment: $(FLIM_ENVIRONMENT)
        FLIMSupabaseURL: $(FLIM_SUPABASE_URL)
        FLIMSupabaseKey: $(FLIM_SUPABASE_KEY)
        FLIMAppGroup: $(FLIM_APP_GROUP)
        FLIMURLScheme: $(FLIM_URL_SCHEME)
        # An extension's CFBundleVersion must match its containing app's, or App Store Connect
        # rejects the upload. CURRENT_PROJECT_VERSION arrives correctly via CI's xcargs (applies
        # project-wide, not per-target), but MARKETING_VERSION only exists as a literal on the
        # Flim target's own settings below — mirrored as a literal here too since nothing
        # propagates it automatically. Bumping MARKETING_VERSION means updating both targets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLIM_BUNDLE_ID).RollActivityWidget
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DCU7GHRVUQ
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.6.3"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug: &widget_debug
          CODE_SIGN_STYLE: Automatic
        Debug-Beta: *widget_debug
        Release: &widget_release
          # Needs its own "match AppStore com.flim.app.RollActivityWidget" profile before this
          # builds in CI — a new bundle ID needs a new App ID + profile in the Developer portal
          # first, which is a manual, one-time step (see the commit message for this target).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore $(FLIM_BUNDLE_ID).RollActivityWidget"
        Release-Beta: *widget_release

  FlimNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FlimNotificationService
      # Shared with the app target so its checks run in FlimTests.
      - path: Flim/Models/PushImage.swift
      # Which FLIM this is: the storage host PushImage trusts comes from it.
      - path: Flim/Config/FlimEnvironment.swift
    info:
      path: FlimNotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(FLIM_DISPLAY_NAME)
        # Same keys as the app's, read by FlimEnvironment.swift from this bundle's own plist.
        FLIMEnvironment: $(FLIM_ENVIRONMENT)
        FLIMSupabaseURL: $(FLIM_SUPABASE_URL)
        FLIMSupabaseKey: $(FLIM_SUPABASE_KEY)
        FLIMAppGroup: $(FLIM_APP_GROUP)
        FLIMURLScheme: $(FLIM_URL_SCHEME)
        # Must match the containing app's, the same as the widget's (see its note above).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLIM_BUNDLE_ID).NotificationService
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DCU7GHRVUQ
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.6.3"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug: &nse_debug
          CODE_SIGN_STYLE: Automatic
        Debug-Beta: *nse_debug
        Release: &nse_release
          # Needs "match AppStore com.flim.app.NotificationService" in the certs repo before CI
          # can archive: `bundle exec fastlane certificates` registers the App ID and makes it.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore $(FLIM_BUNDLE_ID).NotificationService"
        Release-Beta: *nse_release

  FlimTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FlimTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flim.app.tests
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: Flim

  FlimUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FlimUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flim.app.uitests
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: Flim

schemes:
  Flim:
    build:
      targets:
        Flim: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlimTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # FLIM Beta: the same app built as the beta (configs above). No test action: the suite runs
  # against production's configuration in the Flim scheme, and a beta without its project set
  # stops at launch by design.
  FLIM Beta:
    build:
      targets:
        Flim: all
    run:
      config: Debug-Beta
    profile:
      config: Release-Beta
    analyze:
      config: Debug-Beta
    archive:
      config: Release-Beta
  # On demand only: `xcodebuild test -scheme FlimUITests ...` drives a simulator through XCUITest
  # (no account needed, see FlimUITests). Kept out of the Flim scheme so CI's `xcodebuild test`
  # and the local suite stay UI-free.
  FlimUITests:
    build:
      targets:
        Flim: all
        FlimUITests: [test]
    test:
      config: Debug
      targets:
        - FlimUITests
