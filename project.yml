name: Flim

options:
  bundleIdPrefix: com.flim
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Flim:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Flim
    entitlements:
      path: Flim/Flim.entitlements
      properties:
        # Resolved per build config: development (Debug) / production (Release).
        # Distribution/TestFlight builds require production, so this must vary.
        aps-environment: $(APS_ENVIRONMENT)
        # Shared container for the home-screen widget. The extension cannot read the app's
        # sandbox, so the snapshot the widget renders crosses through this group; it must be
        # present on BOTH targets and must match `WidgetStore.appGroup` exactly.
        com.apple.security.application-groups:
          - group.com.flim.app
        # Makes https://flim-app.com/join/CODE open the app directly instead of dead-ending on
        # the web landing page. The AASA at /.well-known/apple-app-site-association is already
        # live and correct (DCU7GHRVUQ.com.flim.app, /join/*), so this entitlement is the last
        # piece. It signs ONLY if the match profile carries the Associated Domains capability —
        # enable it on the App ID, then re-run match --force, or the archive fails.
        com.apple.developer.associated-domains:
          - applinks:flim-app.com
    info:
      path: Flim/Info.plist
      properties:
        # Home-screen app name. To rename the app: change this + AppInfo.appName (covers the UI).
        CFBundleDisplayName: FLIM
        # App uses only standard HTTPS (exempt encryption) — declaring this skips
        # the per-build export-compliance prompt so builds reach testers automatically.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Modern launch screen (no storyboard file needed on iOS 14+).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Used to take disposable photos that develop over time."
        NSPhotoLibraryAddUsageDescription: "Save your developed photos to your camera roll."
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # Kept as com.lapse.app to match the Supabase auth redirect allowlist.
              - com.lapse.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flim.app
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DCU7GHRVUQ
        ENABLE_PREVIEWS: YES
        # iPhone only — a portrait camera app; avoids iPad multitasking requirements.
        TARGETED_DEVICE_FAMILY: "1"
        # Versioning — CI passes CURRENT_PROJECT_VERSION=<next TestFlight build>.
        # 1.0 shipped to the App Store and Apple closes a version's TestFlight train once
        # it's been approved (ASC rejected further 1.0 uploads with "Invalid Pre-Release
        # Train... previously approved version"). Bump this again for the next release.
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
          CODE_SIGN_STYLE: Automatic
        Release:
          APS_ENVIRONMENT: production
          # Signing lives on the APP TARGET (not global xcargs) so it doesn't
          # leak onto SPM package targets, which reject provisioning profiles.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.flim.app"
    dependencies:
      - package: supabase-swift
        product: Supabase
      # The Live Activity widget extension. Its App ID and "match AppStore
      # com.flim.app.RollActivityWidget" profile now exist in the certs repo, so this
      # is embedded and signed alongside the app on every Release archive.
      - target: RollActivityWidget
        embed: true

  RollActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RollActivityWidget
      # Shared with the app target — see the file's own header comment for why this is a second
      # explicit source entry instead of a shared framework.
      - path: Flim/Models/RollRevealAttributes.swift
      # Same reason: the accent the person picked is carried in the activity's content state, and
      # both sides need to turn that name into the same color.
      - path: Flim/Models/FlimAccentPalette.swift
      # The lock-screen card's layout, shared so it can be previewed and screenshotted from the
      # app instead of only ever being seen on a locked device.
      - path: Flim/Models/RollRevealCard.swift
      # What the home-screen widget shows, and the App Group container both sides read it from.
      # Same second-source-entry pattern as the three above.
      - path: Flim/Models/WidgetSnapshot.swift
      # The tokens all three off-app surfaces are drawn from. Shared because the Live Activity
      # card lives in Flim/Models and the home tiles live in the extension, so a hex value
      # defined in either would need a second copy in the other.
      - path: Flim/Models/WidgetTheme.swift
    entitlements:
      path: RollActivityWidget/RollActivityWidget.entitlements
      properties:
        # The other half of the shared container. Same group as the app target above; without it
        # here the extension's own container lookup returns nil and the widget can only ever
        # render its empty state.
        com.apple.security.application-groups:
          - group.com.flim.app
    info:
      path: RollActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: FLIM
        # An extension's CFBundleVersion must match its containing app's, or App Store Connect
        # rejects the upload. CURRENT_PROJECT_VERSION arrives correctly via CI's xcargs (applies
        # project-wide, not per-target), but MARKETING_VERSION only exists as a literal on the
        # Flim target's own settings below — mirrored as a literal here too since nothing
        # propagates it automatically. Bumping MARKETING_VERSION means updating both targets.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flim.app.RollActivityWidget
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: DCU7GHRVUQ
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          # Needs its own "match AppStore com.flim.app.RollActivityWidget" profile before this
          # builds in CI — a new bundle ID needs a new App ID + profile in the Developer portal
          # first, which is a manual, one-time step (see the commit message for this target).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.flim.app.RollActivityWidget"

  FlimTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FlimTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flim.app.tests
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: Flim

schemes:
  Flim:
    build:
      targets:
        Flim: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlimTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
